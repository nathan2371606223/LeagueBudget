name: Deploy Visitor to GH Pages

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-visitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-visitor/package-lock.json
      - run: npm install
      - run: npm run build
        env:
          VITE_API_BASE: https://leaguebudget-production.up.railway.app/api
          VITE_BASE_PATH: /LeagueBudget/visitor/
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend-visitor/dist
          destination_dir: visitor
          publish_branch: gh-pages
          keep_files: true
          force_orphan: false
